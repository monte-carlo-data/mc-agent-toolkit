name: OpenCode Plugin Tests

on:
  push:
    branches: [main]
    paths:
      - 'plugins/opencode/**'
      - '.github/workflows/opencode-tests.yml'
  pull_request:
    paths:
      - 'plugins/opencode/**'
      - '.github/workflows/opencode-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/opencode
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun test

      # OpenCode v2 can run plugins under Node, which loads the TypeScript sources
      # natively (explicit .ts imports, no Bun-only APIs).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Node smoke test
        run: bun run test:node
